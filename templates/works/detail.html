<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ section.title }} | {{ config.title | default(value="Blog") }}
    </title>
    <link rel="stylesheet" href="{{ get_url(path='main.css') }}">
</head>

<body>
    <main class="site-main">
        <article>
            {% include "components/section_heading.html" %}
            {% if section.pages %}
            <h2>In this work</h2>
            <ol class="work-pages">
                {% for page in section.pages %}
                <li><a href="{{ page.permalink }}">{{ page.title }}</a></li>
                {% endfor %}
            </ol>
            {% endif %}
            <div class="post-content">
                {{ section.content | safe }}
            </div>
        </article>
    </main>
</body>

</html>
