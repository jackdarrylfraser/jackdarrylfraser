<article class="post-card">
    <h3><a href="{{ page.permalink }}">{{ page.title }}</a></h3>
    
    <time class="post-meta" datetime="{{ page.date }}">{{ page.date |
        date(format="%B %e, %Y") }}</time>

    <div class="post-card-excerpt">{{ page.summary | safe }}</div>

    {% set tags = page.taxonomies.tags %}
    {% include "components/tag_list.html" %}
</article>
