<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ term.name }} | {{ config.title }}</title>
    <link rel="stylesheet" href="{{ get_url(path='main.css') }}" />
</head>

<body>
    <main class="site-main">
        {% include "components/section_heading.html" %}
        {% if term.pages %}
        <ul class="post-list">
            {% set post_heading_level = 2 %} {% for page in term.pages %}
            <li>{% include "components/work_card.html" %}</li>
            {% endfor %}
        </ul>
        {% else %}
        <p>No posts found for this term.</p>
        {% endif %}
    </main>
</body>

</html>
