<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ taxonomy.name }} | {{ config.title }}</title>
    <link rel="stylesheet" href="{{ get_url(path='main.css') }}" />
</head>

<body>
    <main class="site-main">
        {% include "components/section_heading.html" %}
        <ul class="tag-list" aria-label="Tags">
            {% for term in terms %}
            <li>
                <a href="{{ term.permalink }}">{{ term.name }} ({{ term.pages |
                    length }})</a>
            </li>
            {% endfor %}
        </ul>
    </main>
</body>

</html>
