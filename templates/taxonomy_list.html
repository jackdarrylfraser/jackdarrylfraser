<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ taxonomy.name | capitalize }} | {{ config.title }}</title>
  </head>
  <body>
    <main>
      <h1>{{ taxonomy.name | capitalize }}</h1>
      <ul>
        {% for term in terms %}
        <li><a href="{{ term.permalink }}">{{ term.name }}</a> ({{ term.pages | length }})</li>
        {% endfor %}
      </ul>
    </main>
  </body>
</html>
