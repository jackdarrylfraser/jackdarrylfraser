<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ taxonomy.name }} | {{ config.title }}</title>
    <link rel="stylesheet" href="{{ get_url(path='main.css') }}">
  </head>
  <body>
    <main class="site-main">
      <div class="section-heading">
        <h1>{{ taxonomy.name }}</h1>
        <nav class="section-links" aria-label="Tag navigation">
          <a href="{{ config.base_url }}">Back to all posts</a>
        </nav>
      </div>
      <ul class="tag-list" aria-label="Tags">
        {% for term in terms %}
        <li>
          {% set post_count = term.pages | length %}
          <a href="{{ term.permalink }}">{{ term.name }} ({{ post_count }})</a>
        </li>
        {% endfor %}
      </ul>
    </main>
  </body>
</html>
